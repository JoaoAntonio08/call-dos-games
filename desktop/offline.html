<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Call dos Games</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1f2023; color: #f2f3f5; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; }
      h1 { font-size: 28px; margin: 0 0 6px; }
      p { color: #c4c7ce; margin: 0 0 22px; max-width: 420px; }
      button { font: inherit; font-weight: 600; background: #5865f2; color: #fff; border: 0; border-radius: 12px; padding: 11px 26px; cursor: pointer; }
      button:hover { background: #7884f6; }
      small { display: block; margin-top: 14px; color: #80848e; }
    </style>
  </head>
  <body>
    <div>
      <h1>Sem conexão com a turma</h1>
      <p>Confira a internet. Se ela estiver ok, o servidor da turma pode estar desligado agora.</p>
      <button id="retry">Tentar de novo</button>
      <small id="auto">Tentando de novo sozinho em 15 s…</small>
    </div>
    <script>
      const back = new URLSearchParams(location.search).get("voltar") || "https://call.zapeu.net/app";
      const retry = () => (location.href = back);
      document.getElementById("retry").onclick = retry;
      let n = 15;
      const t = setInterval(() => {
        n -= 1;
        document.getElementById("auto").textContent = n > 0 ? `Tentando de novo sozinho em ${n} s…` : "Tentando…";
        if (n <= 0) {
          clearInterval(t);
          retry();
        }
      }, 1000);
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
