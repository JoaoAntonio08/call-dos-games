<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Compartilhar a tela</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #1f2023; color: #f2f3f5; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 18px 20px 6px; }
      h1 { margin: 0; font-size: 20px; font-weight: 700; }
      p { margin: 4px 0 0; color: #c4c7ce; font-size: 13px; }
      .tabs { display: flex; gap: 6px; padding: 12px 20px 0; }
      .tabs button { background: none; border: 0; color: #c4c7ce; font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
      .tabs button[aria-selected="true"] { background: #f2f3f5; color: #18191c; }
      main { flex: 1; overflow-y: auto; padding: 14px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-content: start; }
      .src { background: #27282c; border: 2px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
      .src:hover { background: #313238; }
      .src[aria-pressed="true"] { border-color: #5865f2; }
      .src img.thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #111214; border-radius: 8px; display: block; }
      .name { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name img { width: 16px; height: 16px; flex: none; }
      footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid #111214; }
      footer button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 18px; cursor: pointer; }
      .cancel { background: #313238; color: #f2f3f5; }
      .go { background: #5865f2; color: #fff; }
      .go:disabled { opacity: .45; cursor: default; }
      .empty { color: #c4c7ce; grid-column: 1 / -1; text-align: center; padding: 40px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>O que você quer mostrar?</h1>
      <p>O som do PC vai junto quando você marca “Compartilhar áudio” no app.</p>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-kind="screen">Telas</button>
      <button role="tab" aria-selected="false" data-kind="window">Janelas</button>
    </div>
    <main id="list"><div class="empty">Procurando telas e janelas…</div></main>
    <footer>
      <button class="cancel" id="cancel">Cancelar</button>
      <button class="go" id="go" disabled>Compartilhar</button>
    </footer>
    <script>
      let all = [];
      let kind = "screen";
      let chosen = null;
      const list = document.getElementById("list");
      const go = document.getElementById("go");

      function render() {
        const items = all.filter((s) => (kind === "screen" ? s.screen : !s.screen));
        list.textContent = "";
        if (!items.length) {
          const d = document.createElement("div");
          d.className = "empty";
          d.textContent = kind === "screen" ? "Nenhuma tela encontrada." : "Nenhuma janela aberta.";
          list.append(d);
        }
        items.forEach((s, i) => {
          const b = document.createElement("button");
          b.className = "src";
          b.setAttribute("aria-pressed", String(chosen === s.id));
          const t = document.createElement("img");
          t.className = "thumb";
          t.src = s.thumb;
          t.alt = "";
          const n = document.createElement("div");
          n.className = "name";
          if (s.icon) {
            const ic = document.createElement("img");
            ic.src = s.icon;
            ic.alt = "";
            n.append(ic);
          }
          n.append(s.screen && all.filter((x) => x.screen).length > 1 ? `Tela ${i + 1}` : s.name);
          b.append(t, n);
          b.onclick = () => {
            chosen = s.id;
            go.disabled = false;
            render();
          };
          b.ondblclick = () => window.picker.choose(s.id);
          list.append(b);
        });
      }

      document.querySelectorAll(".tabs button").forEach((b) => {
        b.onclick = () => {
          kind = b.dataset.kind;
          document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
          render();
        };
      });
      document.getElementById("cancel").onclick = () => window.picker.choose(null);
      go.onclick = () => chosen && window.picker.choose(chosen);
      document.addEventListener("keydown", (e) => e.key === "Escape" && window.picker.choose(null));

      window.picker.sources().then((s) => {
        all = s;
        const screens = all.filter((x) => x.screen);
        if (screens.length === 1) {
          chosen = screens[0].id;
          go.disabled = false;
        }
        render();
      });
    </script>
  </body>
</html>
