[package]
name = "call-dos-games"
version = "2.0.1"
description = "App de Windows do Call dos Games"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri = { version = "2.12.7", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2"
ureq = "3.5.2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
minisign-verify = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
