name: Promote signed Windows update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the tested public desktop release, e.g. 2.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: windows-updater
    steps:
      - name: Check versioned release and manifesto
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version' }
          $tag = "desktop-v$env:VERSION"
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft) { throw 'Versioned release is not public' }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ('latest.json' -notin $names) { throw 'Signed updater manifest missing' }
          if (@($names | Where-Object { $_ -match '\.exe$' }).Count -lt 1) { throw 'NSIS installer missing' }
          if (@($names | Where-Object { $_ -match '\.exe\.sig$' }).Count -lt 1) { throw 'Installer signature missing' }
          gh release download $tag --pattern latest.json --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download updater manifest' }
          $manifest = Get-Content (Join-Path $env:RUNNER_TEMP 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw 'Manifest version differs from release version' }
          $targets = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -like 'windows-*' })
          if ($targets.Count -lt 1) { throw 'Windows target missing from manifest' }
          foreach ($target in $targets) {
            if ([string]::IsNullOrWhiteSpace($target.Value.signature)) { throw 'Signature missing in manifest' }
            $prefix = "https://github.com/$env:GH_REPO/releases/download/$tag/"
            if (-not $target.Value.url.StartsWith($prefix)) { throw 'Installer URL points outside the versioned release' }
          }
          if ($names -notcontains 'latest.json') { throw 'Manifest not in release assets' }
          gh release view desktop-latest --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --target $env:GITHUB_SHA --title 'Desktop updater manifest' --notes 'Stable manifest for signed Windows updates.' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create desktop update channel' }
          }
          gh release upload desktop-latest (Join-Path $env:RUNNER_TEMP 'latest.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot promote tested manifest' }
