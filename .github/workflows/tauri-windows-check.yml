name: Tauri Windows check

on:
  pull_request:
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/tauri-windows-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-tauri
      - name: Test Windows app with locked dependencies
        run: cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml
      - name: Upload lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock
          path: desktop-tauri/src-tauri/Cargo.lock
