name: Build signed Windows draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: windows-updater
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Verify signing configuration
        shell: pwsh
        env:
          CDG_UPDATER_PUBKEY: ${{ vars.CDG_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CDG_UPDATER_PUBKEY)) { throw 'Updater public key missing' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater signing key missing' }
      - name: Pass updater public key to the bundler
        # o bundler do Tauri exige plugins.updater.pubkey para gerar os artefatos do updater;
        # a chave pública vem da variável do repositório e não fica no código
        shell: pwsh
        env:
          CDG_UPDATER_PUBKEY: ${{ vars.CDG_UPDATER_PUBKEY }}
        run: |
          $conf = @{ plugins = @{ updater = @{ pubkey = $env:CDG_UPDATER_PUBKEY.Trim() } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'updater.conf.json') -Value $conf -Encoding utf8NoBOM
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-tauri
      - name: Build signed draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDG_UPDATER_PUBKEY: ${{ vars.CDG_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-tauri
          tagName: desktop-v__VERSION__
          releaseName: Call dos Games Desktop v__VERSION__
          releaseDraft: true
          args: --config ${{ runner.temp }}/updater.conf.json
          prerelease: false
      - name: Point latest.json to the public download URL
        # em rascunho o tauri-action grava o endereço da API (assets/<id>); o canal de atualização
        # e o Promote exigem o link público da release versionada (válido assim que ela for publicada)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content desktop-tauri/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $dir = Join-Path $env:RUNNER_TEMP 'manifest'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $tag --pattern latest.json --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download draft manifest' }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $installers = @($release.assets | Where-Object { $_.name -match '_x64-setup\.exe$' })
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer in the draft' }
          $url = "https://github.com/$env:GH_REPO/releases/download/$tag/$($installers[0].name)"
          $file = Join-Path $dir 'latest.json'
          $manifest = Get-Content $file -Raw | ConvertFrom-Json
          foreach ($platform in $manifest.platforms.PSObject.Properties) { $platform.Value.url = $url }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $file -Encoding utf8NoBOM
          gh release upload $tag $file --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot update draft manifest' }
