<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call dos Games</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f2023; color: #f2f3f5; font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 0 24px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #c4c7ce; margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; background: #5865f2; color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; }
  small { display: block; margin-top: 14px; color: #80848e; }
</style>
</head>
<body>
<div>
  <h1>Sem conexão com a turma</h1>
  <p>Confira a internet. Se ela estiver ok, o servidor da turma pode estar desligado agora.</p>
  <button id="retry">Tentar de novo</button>
  <small id="auto">Tentando de novo sozinho em 15 s…</small>
</div>
<script>
  const retry = () => (location.href = "https://call-dos-games.vercel.app/app");
  document.getElementById("retry").onclick = retry;
  let n = 15;
  const t = setInterval(() => {
    n -= 1;
    document.getElementById("auto").textContent = n > 0 ? "Tentando de novo sozinho em " + n + " s…" : "Tentando…";
    if (n <= 0) { clearInterval(t); retry(); }
  }, 1000);
  window.addEventListener("online", retry);
</script>
</body>
</html>
