plugins {
    id "com.android.application"
}

// versão do app: ao mudar, suba também o versionCode e atualize public/apps/versao.json no site
def VERSAO = "1.2.0"

// A chave fica em android/keystore/ (fora do git). Sem ela não dá para atualizar o app: guarde backup!
def ks = new Properties()
def ksFile = rootProject.file("keystore/keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "com.calldosgames.app"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.calldosgames.app"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName VERSAO
        // o site lê a versão do endereço de abertura para avisar quando tiver uma nova
        manifestPlaceholders = [versao: VERSAO]
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file("keystore/" + new File(ks.getProperty("storeFile")).name)
                storePassword ks.getProperty("storePassword")
                keyAlias ks.getProperty("keyAlias")
                keyPassword ks.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
